name: Build

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: ['11', '21', '25']
        maven: ['3.8.8', '3.9.9', '4.0.0-rc-5']
        exclude:
          - java: '11'
            maven: '4.0.0-rc-5'
    name: build (java ${{ matrix.java }}, maven ${{ matrix.maven }})
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java }}
          distribution: 'temurin'
          cache: 'maven'

      - uses: stCarolas/setup-maven@v5
        with:
          maven-version: ${{ matrix.maven }}

      - run: mvn -B package

      - name: Integration test
        run: bash test-project/run-test.sh

      - uses: actions/upload-artifact@v4
        if: matrix.java == '11' && matrix.maven == '3.9.9'
        with:
          name: maven-sane-out.jar
          path: target/maven-sane-out-slf4j-*.jar
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: 'maven'

      - run: mvn -B package

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp target/maven-sane-out-slf4j-*.jar maven-sane-out.jar
          gh release create "$GITHUB_REF_NAME" maven-sane-out.jar \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
