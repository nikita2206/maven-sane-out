name: Build

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: 'maven'

      - run: mvn -B package

      - uses: actions/upload-artifact@v4
        with:
          name: maven-sane-out.jar
          path: target/maven-sane-out-slf4j-*.jar
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: 'maven'

      - run: mvn -B package

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp target/maven-sane-out-slf4j-*.jar maven-sane-out.jar
          gh release create "$GITHUB_REF_NAME" maven-sane-out.jar \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
